name: DsBoss
version: 1.0.2
main: com.dobeshadow.dsboss.DsBoss
api-version: "1.21"
author: DobeShadow
description: Custom BOSS plugin - configurable bosses with scheduled spawns, rewards, and broadcasts
softdepend: [Vault]

commands:
  dsboss:
    description: DsBoss admin commands
    usage: /<command> <reload|list|spawn|kill|info>
    aliases: [cboss, cb]
    permission: dsboss.admin

permissions:
  dsboss.admin:
    description: Access to DsBoss admin commands
    default: op
  dsboss.use:
    description: Allows interacting with boss events
    default: true
